name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: TypeScript, command: "npm run typecheck" }
          - { name: ESLint, command: "npm run lint -- --max-warnings=0" }
          - {
              name: Unit tests,
              command: "npm test -- --exclude '**/*database.test.ts' --maxWorkers=2",
            }
          - { name: Dead code, command: "npm run knip" }
          - { name: Production build, command: "npm run build && npm run check:client-secrets" }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.check.command }}

  database:
    name: Database security and transactions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db
      # No Supabase credentials, host port or copied customer data.
      - run: bash scripts/testing/native-postgres.sh

  dependencies:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (redacted)
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner

  e2e:
    name: Storefront and anonymous security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Dedicated local fixture server; no repository secrets or Preview URL.
      - run: npm run test:e2e:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  required:
    name: CI required
    if: always()
    needs: [quality, database, dependencies, secrets, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed, including skips and cancellations
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(job=>job.result!=="success")) process.exit(1)'
